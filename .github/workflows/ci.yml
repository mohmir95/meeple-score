name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the local SDK so CI analyzes with the same lints; bump both together.
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --concurrency=1

  # Builds the site and uploads it. Deploying happens in its own job below:
  # a deploy in the same job as the upload sometimes can't see the artifact
  # yet ("No artifacts named github-pages were found").
  build:
    needs: verify
    # Pushes to main deploy; "Run workflow" on main redeploys without a commit.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the local SDK so CI analyzes with the same lints; bump both together.
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The app compares its compiled APP_BUILD with app_version.json to offer
      # an update when a newer build is deployed.
      - name: Build web
        run: >-
          flutter build web --release
          --base-href /${{ github.event.repository.name }}/
          --dart-define=APP_BUILD=${{ github.sha }}

      - name: Prepare GitHub Pages files
        run: |
          echo '{"build":"${{ github.sha }}"}' > build/web/app_version.json
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  # If this job fails, use "Re-run failed jobs": it deploys the artifact the
  # build job already uploaded. "Re-run all jobs" would upload a second one.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
